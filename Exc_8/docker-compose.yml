services:
  # ----------------------------------------
  # Kafka 4.1 — single node, KRaft mode (the same image as in Exercises 5 and 6)
  # ----------------------------------------
  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"   # clients on your machine
    environment:
      # Kafka CLI tools (kafka-topics.sh, ...) on the PATH for `docker exec`
      PATH: /opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CLUSTER_ID: hgb-bigdata-kafka-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # EXTERNAL: localhost:9092 (your machine)  INTERNAL: kafka:29092 (Spark, generator)
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # a single broker cannot hold more than one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      retries: 20

  # ----------------------------------------
  # Web UI for Kafka: topics, partitions, messages, consumer groups
  # ----------------------------------------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.3.0
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # ----------------------------------------
  # Spark 4.2 + Jupyter: the batch (Exercise 7) and streaming (Exercise 8) jobs
  # ----------------------------------------
  spark:
    # Spark 4.2.1, Python 3.13, Java 21; amd64 + arm64. Pinned by digest: the tag is rebuilt from time to time
    image: quay.io/jupyter/pyspark-notebook:spark-4.2.1@sha256:0660e7a553729435783e1b87c118028b109e46e881f4e73152c1f1391c9cb204
    container_name: spark-lab
    ports:
      - "8888:8888"   # Jupyter
      - "4040:4040"   # Spark UI (while a Spark session is running)
      - "4041:4041"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data       # your data lake goes here (data/lake/ on your machine)
      - ./tools:/home/jovyan/tools:ro  # the building blocks and the lake checker
    user: root
    environment:
      - JUPYTER_TOKEN=lab
      - NB_UID=1000
      - NB_GID=100
      - CHOWN_EXTRA=/home/jovyan/work,/home/jovyan/data
      - CHOWN_EXTRA_OPTS=-R
    command: start-notebook.py --IdentityProvider.token=lab

  # ----------------------------------------
  # Log generator: application logs of 1,000 users into the topic `logs`.
  # Not started by `docker compose up`; run it on demand:
  #   docker compose run --rm generator
  # ----------------------------------------
  generator:
    image: adrianovogel/hgb-load-gen:2026   # same image in the batch, stream and analytical exercises
    profiles: ["generator"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: logs
      TARGET_RPS: 20000            # records per second
      MAX_RECORDS: 2000000         # stop after this many records (-1 = run forever)
      ADDITIONAL_TERM: crash       # every ADDITIONAL_TERM_RATE-th record mentions a crash
      ADDITIONAL_TERM_RATE: 100
      LATE_RATE: 0                 # fraction of records with an event time in the past (analytical exercise)
      LATE_MAX_MS: 0               # ... up to this many milliseconds
